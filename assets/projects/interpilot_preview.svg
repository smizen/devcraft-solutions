<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" fill="none">
  <!-- Window Container -->
  <rect x="10" y="10" width="480" height="600" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Window Top Bar -->
  <path d="M 10 24 C 10 16.27 16.27 10 24 10 L 476 10 C 483.73 10 490 16.27 490 24 L 490 52 L 10 52 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <circle cx="32" cy="31" r="4.5" fill="#EF4444" />
  <circle cx="48" cy="31" r="4.5" fill="#F59E0B" />
  <circle cx="64" cy="31" r="4.5" fill="#10B981" />
  <rect x="120" y="22" width="260" height="18" rx="9" fill="#EDF2F7" />
  <text x="250" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B">app.interpilot.io/planning</text>

  <!-- InterPilot Global App Header (as in InterPilot layout.tsx) -->
  <g transform="translate(10, 52)">
    <rect x="0" y="0" width="480" height="50" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Brand Logo IP -->
    <rect x="16" y="9" width="32" height="32" rx="8" fill="#1E3A8A" />
    <text x="32" y="31" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">IP</text>
    <text x="56" y="30" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#1E3A8A" letter-spacing="-0.3">InterPilot</text>

    <!-- Nav Links -->
    <rect x="156" y="12" width="86" height="26" rx="6" fill="#EFF6FF" />
    <text x="199" y="29" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">Planning</text>
    <text x="272" y="29" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Aujourd'hui</text>
    <text x="345" y="29" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Interventions</text>
    <text x="420" y="29" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Clients</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(25, 118)">
    <rect x="0" y="0" width="142" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">AUJOURD'HUI</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">48 <tspan font-size="11" font-weight="600" fill="#10B981">interventions</tspan></text>

    <rect x="154" y="0" width="142" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="168" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">TECHNICIENS</text>
    <text x="168" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#0F172A">12 <tspan font-size="11" font-weight="600" fill="#64748B">en tournée</tspan></text>

    <rect x="308" y="0" width="142" height="64" rx="8" fill="#FFF7ED" stroke="#FED7AA" />
    <text x="322" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#C2410C">TAUX CLÔTURE</text>
    <text x="322" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#C2410C">94.2%</text>
  </g>

  <!-- Central Planning Grid (Tournées Techniciens) -->
  <g transform="translate(25, 196)">
    <rect x="0" y="0" width="450" height="390" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    
    <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="750" fill="#0F172A">PLANNING DES TOURNÉES &amp; INTERVENTIONS TERRAIN</text>
    <text x="16" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Synchronisation multi-tenant, affectation géographique et rapports signés</text>

    <!-- Technicien 1 Card -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="418" height="98" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Tech info -->
      <circle cx="24" cy="24" r="12" fill="#1E3A8A" />
      <text x="24" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">MD</text>
      <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Marc Dupont · Tournée IDF Nord</text>
      <text x="44" y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Véhicule utilitaire #04 · 4 étapes planifiées</text>

      <rect x="330" y="14" width="76" height="20" rx="4" fill="#FEF3C7" />
      <text x="368" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#B45309">EN COURS</text>

      <!-- Sub-task 1 -->
      <rect x="16" y="46" width="186" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="24" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">08:30 · Maintenance CVC</text>
      <text x="24" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#10B981">✓ Terminé &amp; signé</text>

      <!-- Sub-task 2 -->
      <rect x="212" y="46" width="190" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="220" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A">11:15 · Dépannage CTA</text>
      <text x="220" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#2563EB">En intervention · Tremblay</text>
    </g>

    <!-- Technicien 2 Card -->
    <g transform="translate(16, 166)">
      <rect x="0" y="0" width="418" height="98" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Tech info -->
      <circle cx="24" cy="24" r="12" fill="#047857" />
      <text x="24" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">SL</text>
      <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Sarah Lambert · Tournée IDF Sud</text>
      <text x="44" y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Équipement Haute Tension · 3 sites</text>

      <rect x="330" y="14" width="76" height="20" rx="4" fill="#DCFCE7" />
      <text x="368" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#15803D">CLÔTURÉ</text>

      <!-- Sub-task 1 -->
      <rect x="16" y="46" width="186" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="24" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">09:00 · Audit TGBT Orly</text>
      <text x="24" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#10B981">✓ Rapport PDF transmis</text>

      <!-- Sub-task 2 -->
      <rect x="212" y="46" width="190" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="220" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">14:00 · Contrôle Armoire</text>
      <text x="220" y="76" font-family="-apple-system, sans-serif" font-size="9" fill="#10B981">✓ Validé avec signature</text>
    </g>

    <!-- Bottom Feature highlights -->
    <g transform="translate(16, 276)">
      <rect x="0" y="0" width="418" height="98" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="750" fill="#0F172A">CAPACITÉS ARCHITECTURALES DU SYSTÈME</text>
      
      <circle cx="24" cy="46" r="4" fill="#10B981" />
      <text x="36" y="50" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#334155">Multi-tenant avec isolation stricte des données clients (Prisma &amp; PostgreSQL)</text>

      <circle cx="24" cy="68" r="4" fill="#10B981" />
      <text x="36" y="72" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#334155">Signature numérique sur mobile et génération instantanée de bordereau PDF</text>

      <circle cx="24" cy="90" r="4" fill="#10B981" />
      <text x="36" y="93" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#334155">Stockage sécurisé des photos d'intervention horodatées sur AWS S3</text>
    </g>
  </g>
</svg>
