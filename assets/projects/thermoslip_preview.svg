      <rect x="7" y="0" width="2" height="42" fill="#0F172A" />
      <rect x="12" y="0" width="6" height="42" fill="#0F172A" />
      <rect x="22" y="0" width="3" height="42" fill="#0F172A" />
      <rect x="28" y="0" width="8" height="42" fill="#0F172A" />
      <rect x="39" y="0" width="2" height="42" fill="#0F172A" />
      <rect x="45" y="0" width="5" height="42" fill="#0F172A" />
      <rect x="54" y="0" width="3" height="42" fill="#0F172A" />
      <rect x="60" y="0" width="7" height="42" fill="#0F172A" />
      <rect x="70" y="0" width="2" height="42" fill="#0F172A" />
      <rect x="76" y="0" width="5" height="42" fill="#0F172A" />
      <rect x="85" y="0" width="7" height="42" fill="#0F172A" />
      <rect x="96" y="0" width="3" height="42" fill="#0F172A" />
      <rect x="103" y="0" width="6" height="42" fill="#0F172A" />
      <rect x="113" y="0" width="2" height="42" fill="#0F172A" />
      <rect x="118" y="0" width="7" height="42" fill="#0F172A" />
      <rect x="129" y="0" width="4" height="42" fill="#0F172A" />
      <rect x="137" y="0" width="2" height="42" fill="#0F172A" />
      <rect x="143" y="0" width="6" height="42" fill="#0F172A" />
      <rect x="153" y="0" width="3" height="42" fill="#0F172A" />
      <rect x="160" y="0" width="8" height="42" fill="#0F172A" />
      <rect x="172" y="0" width="4" height="42" fill="#0F172A" />
      <rect x="180" y="0" width="3" height="42" fill="#0F172A" />
      <rect x="187" y="0" width="7" height="42" fill="#0F172A" />
      <rect x="198" y="0" width="2" height="42" fill="#0F172A" />
    </g>
    <text x="190" y="216" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#0F172A">* SH-1001-COLISSIMO *</text>

    <!-- Items Table Header -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="340" height="24" fill="#0F172A" rx="4" />
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">ARTICLE / DESCRIPTION</text>
      <text x="210" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">SKU</text>
      <text x="310" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">QTÉ</text>

      <!-- Item Row 1 (from DEMO_ORDERS) -->
      <g transform="translate(0, 32)">
        <text x="10" y="14" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Pack T-Shirts Coton Bio</text>
        <text x="10" y="28" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Variante: Noir / Taille M</text>
        <text x="210" y="20" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#475467">TSH-BLK-M</text>
        <text x="310" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#0F172A">x3</text>
        <line x1="0" y1="36" x2="340" y2="36" stroke="#E2E8F0" stroke-width="1" />
      </g>

      <!-- Item Row 2 -->
      <g transform="translate(0, 74)">
        <text x="10" y="14" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Tasse Céramique Artisanale</text>
        <text x="10" y="28" font-family="-apple-system, sans-serif" font-size="9" fill="#64748B">Variante: Blanc Mat</text>
        <text x="210" y="20" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#475467">MUG-WHT-01</text>
        <text x="310" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#0F172A">x1</text>
        <line x1="0" y1="36" x2="340" y2="36" stroke="#E2E8F0" stroke-width="1" />
