      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#64748B">INSTRUCTION CLIENT :</text>
      <text x="10" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F172A">« Sonner à l'interphone Bâtiment B svp »</text>
