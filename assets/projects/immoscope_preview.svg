    <text x="56" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748B">Absence de mise à la terre visible sur photo séjour · Prévoir audit 2 500 €</text>

    <!-- Point 2 -->
    <rect x="16" y="116" width="418" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="36" cy="142" r="10" fill="#FEF3C7" />
    <text x="36" y="146" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#D97706">!</text>
