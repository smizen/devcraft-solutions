    <!-- Point 3 (Checklist item checked) -->
    <rect x="16" y="176" width="418" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="36" cy="202" r="10" fill="#DCFCE7" />
    <text x="36" y="206" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#16A34A">✓</text>
    <text x="56" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Diagnostics DPE &amp; Gaz conformes</text>
    <text x="56" y="212" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748B">Note D conforme pour l'année 1978 · Aucun risque d'interdiction de location</text>

